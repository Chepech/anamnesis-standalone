name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  branch-gate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Check source branch
        run: |
          BRANCH="${{ github.head_ref }}"
          if [[ "$BRANCH" == release/* ]] || [[ "$BRANCH" == hotfix/* ]]; then
            echo "✓ Branch '$BRANCH' is allowed to merge into main"
          else
            echo "✗ Branch '$BRANCH' is not allowed to merge into main"
            echo ""
            echo "Only release/* and hotfix/* branches can merge to main."
            echo "Feature branches should target a release/ branch first."
            exit 1
          fi

  ci:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm typecheck

      - name: Build core daemon
        run: pnpm --filter @anamnesis/core build

      - name: Build Electron main
        run: pnpm --filter @anamnesis/app build:main

      - name: Build renderer
        run: pnpm --filter @anamnesis/app build:renderer
